name: Release

# Every push to main publishes a beta: <version in package.json>-beta.<run number>, built from
# a clean checkout, with the webmail built from its main at the one commit `prepare` read. A
# tag v<version> is a release: the same, with the webmail built from the tag in package.json
# (`config.webmailTag`), so no developer's data can get in. A hand-pushed v*-beta.* tag works
# the same way, if package.json says that version. A manual run builds and publishes nothing.
#
# The build jobs hold no write token. The release job runs no checked-out code. It makes a
# draft, uploads every file with a `.sha256` next to it, signs a build provenance attestation
# and only then publishes, so electron-updater never sees a half-filled release:
# `gh attestation verify <file> --repo bulwarkmail/desktop`.
#
# Signing: Windows signs every build through Azure Artifact Signing when the repository has
# the AZURE_* secrets, and is unsigned otherwise (see the windows job). macOS signs with the
# Developer ID and notarizes every build, betas too, when the repository has the MAC_* and
# APPLE_* secrets, and is ad-hoc signed otherwise. Betas publish with nobody looking. The
# `release` environment a stable tag publishes through doesn't exist yet, and GitHub creates
# it with no reviewers, so until someone sets it up a pushed tag publishes with nobody looking
# too. Whoever can publish here can put code on every install.
# See "First stable release" in the README. Actions are pinned by commit.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Not looked at for tags, so a tag always builds. A docs-only push makes no beta.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "packaging/**"
  workflow_dispatch:
    inputs:
      webmail_ref:
        description: "Webmail branch or tag to build from. Builds only, publishes nothing."
        required: false
        default: "main"

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

# No workflow-wide concurrency group: it would cancel a run that's already publishing. Each
# build job has its own, so a newer push to main ends an older build, and the release job of
# that run then doesn't start. The release job has one that cancels nothing.

jobs:
  prepare:
    name: Decide what to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.versions.outputs.version }}
      webmail_ref: ${{ steps.versions.outputs.webmail_ref }}
      webmail_commit: ${{ steps.versions.outputs.webmail_commit }}
      publish: ${{ steps.versions.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # For a tag, fails in seconds instead of after three builds: a package.json that says
      # another version would offer itself as an update forever. Every job builds the one
      # webmail commit read here, however far main has moved by then.
      - name: Read versions
        id: versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          INPUT_WEBMAIL_REF: ${{ inputs.webmail_ref }}
        run: |
          version="$(node -p "require('./package.json').version")"
          publish=false
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error title=Version mismatch::Tag $REF_NAME but package.json says $version"
              exit 1
            fi
            kind=tag
            ref="$(node -p "require('./package.json').config.webmailTag")"
            if [ "$EVENT_NAME" = "push" ]; then publish=true; fi
          else
            kind=ref
            ref="${INPUT_WEBMAIL_REF:-main}"
            version="${version%%-*}-beta.$RUN_NUMBER"
            if [ "$EVENT_NAME" = "push" ]; then publish=true; fi
          fi
          if ! commit="$(node scripts/fetch-webmail.mjs --resolve "$kind" "$ref")"; then
            echo "::error title=No such webmail $kind::The webmail has no $kind $ref. For a release, set config.webmailTag in package.json to the first tag that has build:desktop."
            exit 1
          fi
          {
            echo "version=$version"
            echo "webmail_ref=$ref"
            echo "webmail_commit=$commit"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (x64, arm64)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    concurrency:
      group: build-windows-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install

      - name: Install dependencies
        run: npm ci

      # Not committed: only this run's packages carry it.
      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm pkg set "version=$VERSION"

      # sharp for the other architecture comes along here: a build on x64 only holds its own.
      - name: Build the webmail
        env:
          # A macOS runner has 7 GB, and Node's default limit ran out there.
          NODE_OPTIONS: --max-old-space-size=6144
          WEBMAIL_REF: ${{ needs.prepare.outputs.webmail_ref }}
          WEBMAIL_COMMIT: ${{ needs.prepare.outputs.webmail_commit }}
        shell: bash
        run: node scripts/fetch-webmail.mjs --ref "$WEBMAIL_REF" --commit "$WEBMAIL_COMMIT" --native win32-arm64

      - name: Build the native helper
        shell: bash
        run: |
          node scripts/build-native.mjs --arch x64
          node scripts/build-native.mjs --arch arm64

      - name: Check the native helper
        run: npx playwright test test/native.spec.ts -g "what the binary"

      # One binary per architecture: before-pack.cjs puts the right one in node_modules.
      - name: Build the policy watcher
        run: node scripts/build-policy-watcher.mjs --arch x64,arm64

      # The flag comes through cl's environment, and hasn't been seen working on a real build yet.
      # When it has, take away the continue-on-error.
      - name: Check the policy watcher
        continue-on-error: true
        run: npx playwright test test/native.spec.ts -g "the policy watcher"

      # Fuses and a real start. On a test pack, since a production build refuses the
      # switches a test needs and restarts itself without them. It's thrown away.
      - name: Test a package
        shell: bash
        run: |
          node node_modules/electron/install.js
          node scripts/pack-test.mjs
          npx playwright test test/fuses.spec.ts
          rm -rf release

      - name: Build the shell
        run: npm run build

      # The installer window's NSIS plugin (native/nsis-splash), 32-bit as NSIS is. Built here
      # and never committed: electron-builder takes it from build/x86-unicode.
      - name: Build the installer window
        run: node scripts/build-nsis-splash.mjs

      # With the secrets: signed through Azure Artifact Signing as "Rath & Blume GbR", and
      # app-update.yml names that publisher, so an install refuses any later installer that
      # isn't signed by it. That's why betas are signed too: a signed stable copy that moves to
      # beta would refuse an unsigned one. Without the secrets: unsigned, as before. The
      # settings are here and not in electron-builder.yml because electron-builder goes for
      # Azure as soon as azureSignOptions is set, and fails without credentials.
      - name: Build installers
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          signing=()
          if [ -n "$AZURE_CLIENT_SECRET" ]; then
            signing=(
              -c.win.azureSignOptions.endpoint=https://plc.codesigning.azure.net/
              -c.win.azureSignOptions.codeSigningAccountName=Bulwark
              -c.win.azureSignOptions.certificateProfileName=bulwark-desktop
              "-c.win.azureSignOptions.publisherName=Rath & Blume GbR"
            )
          else
            unset AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET
          fi
          npx electron-builder --win --x64 --arm64 --publish never "${signing[@]}"

      # Every exe and msi has to carry a valid signature by the publisher, or none of them may.
      - name: Check the signatures
        shell: pwsh
        env:
          SIGNED: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
        run: |
          $bad = 0
          Get-ChildItem release\* -Include *.exe,*.msi | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($env:SIGNED -eq 'true') {
              if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch '^CN="?Rath & Blume GbR') { $bad++ }
            }
          }
          if ($bad) { throw "$bad file(s) without a valid Rath & Blume GbR signature" }

      # The blockmaps let an update download only the blocks of the installer that changed:
      # electron-updater fetches the new one and the one of the version it runs.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.msi
            release/*.yml
            !release/builder-debug.yml
            !release/builder-effective-config.yaml
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS (universal)
    needs: prepare
    runs-on: macos-latest
    # Apple's notarization usually answers in minutes, but can take an hour or more, the
    # first submissions of a team especially.
    timeout-minutes: 180
    concurrency:
      group: build-macos-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install

      - name: Install dependencies
        run: npm ci

      - name: Set the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm pkg set "version=$VERSION"

      # Both of sharp's architectures: a universal app holds them side by side.
      - name: Build the webmail
        env:
          # A macOS runner has 7 GB, and Node's default limit ran out there.
          NODE_OPTIONS: --max-old-space-size=6144
          WEBMAIL_REF: ${{ needs.prepare.outputs.webmail_ref }}
          WEBMAIL_COMMIT: ${{ needs.prepare.outputs.webmail_commit }}
        run: node scripts/fetch-webmail.mjs --ref "$WEBMAIL_REF" --commit "$WEBMAIL_COMMIT" --native darwin-x64,darwin-arm64

      - name: Build the native helper
        run: |
          node scripts/build-native.mjs --arch x64
          node scripts/build-native.mjs --arch arm64

      - name: Check the native helper
        run: npx playwright test test/native.spec.ts -g "what the binary"

      # Built per architecture, and the universal merge makes one binary of the two.
      - name: Build the policy watcher
        run: node scripts/build-policy-watcher.mjs --arch x64,arm64

      - name: Build the shell
        run: npm run build

      # With the secrets: Developer ID signature, hardened runtime, notarization, on betas too,
      # so Gatekeeper opens a beta without a warning and Squirrel.Mac can update it (it refuses
      # an update that isn't signed by the same identity as the running app). Without: an
      # ad-hoc signature, or Apple silicon won't start it at all, and Gatekeeper warns.
      # Hardened runtime with ad-hoc would refuse the bundle's own native modules.
      # The certificate goes into a keychain of the job's own here, not through CSC_LINK:
      # electron-builder prints its failed `security import` command line, password and all,
      # into this public log. `security` itself names neither. The p12 must be in the legacy
      # format (3DES, SHA-1 MAC, `openssl pkcs12 -export -legacy`) with the Developer ID G2
      # intermediate in it: macOS refuses OpenSSL 3's default as "MAC verification failed".
      - name: Build installers
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          signing=()
          if [ -n "$MAC_CERTIFICATE" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            echo "::add-mask::$keychain_password"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            printf '%s' "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
            if ! security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
                -P "$(printf '%s' "$MAC_CERTIFICATE_PASSWORD" | tr -d '\r\n')" \
                -T /usr/bin/codesign -T /usr/bin/productbuild > /dev/null; then
              rm -f "$RUNNER_TEMP/developer-id.p12"
              echo "::error title=Developer ID certificate::MAC_CERTIFICATE doesn't import with MAC_CERTIFICATE_PASSWORD. It has to be a legacy p12, see the comment above this step."
              exit 1
            fi
            rm -f "$RUNNER_TEMP/developer-id.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            # electron-builder wants the name without its "Developer ID Application: " prefix.
            name="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | head -n 1)"
            if [ -z "$name" ]; then
              echo "::error title=Developer ID certificate::MAC_CERTIFICATE holds no valid Developer ID Application identity."
              exit 1
            fi
            echo "Signing as Developer ID Application: $name"
            export CSC_KEYCHAIN="$keychain" CSC_NAME="$name"
          else
            signing=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          if [ -n "${APPLE_API_KEY_BASE64:-}" ] && [ -n "$MAC_CERTIFICATE" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
          fi
          unset APPLE_API_KEY_BASE64 MAC_CERTIFICATE MAC_CERTIFICATE_PASSWORD
          npx electron-builder --mac --universal --publish never "${signing[@]}"

      # A signed build must carry a valid Developer ID signature and a stapled notarization
      # ticket, so Gatekeeper accepts it offline. An ad-hoc build only needs a valid signature.
      - name: Check the signature
        env:
          SIGNED: ${{ secrets.MAC_CERTIFICATE != '' }}
        run: |
          app="$(ls -d release/mac-universal/*.app | head -n 1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)' || true
          if [ "$SIGNED" = true ]; then
            codesign -dv --verbose=2 "$app" 2>&1 | grep -q '^Authority=Developer ID Application: '
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi

      - name: Check the file modes in the packages
        run: node scripts/verify-package-modes.mjs release

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            !release/builder-debug.yml
            !release/builder-effective-config.yaml
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: build-linux-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: rustup toolchain install

      # rpmbuild for the rpm. electron-builder's bundled fpm is x64 only. Xvfb and the
      # keyring for the smoke test.
      - name: Install build tools
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm squashfs-tools xvfb dbus-x11 gnome-keyring x11-utils
          if [ "$ARCH" = "arm64" ]; then
            sudo apt-get install -y ruby ruby-dev build-essential
            sudo gem install --no-document fpm -v 1.16.0
            echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Set the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm pkg set "version=$VERSION"

      - name: Build the webmail
        env:
          # A macOS runner has 7 GB, and Node's default limit ran out there.
          NODE_OPTIONS: --max-old-space-size=6144
          WEBMAIL_REF: ${{ needs.prepare.outputs.webmail_ref }}
          WEBMAIL_COMMIT: ${{ needs.prepare.outputs.webmail_commit }}
        run: node scripts/fetch-webmail.mjs --ref "$WEBMAIL_REF" --commit "$WEBMAIL_COMMIT"

      - name: Build the native helper
        run: node scripts/build-native.mjs

      - name: Check the native helper
        run: npx playwright test test/native.spec.ts -g "what the binary"

      - name: Build the policy watcher
        run: node scripts/build-policy-watcher.mjs --optional

      # On a test pack: production refuses --user-data-dir and --no-sandbox and an unpacked
      # folder has no SUID helper. The sandbox is not what this tests. It's thrown away.
      - name: Smoke test
        env:
          SMOKE_NO_SANDBOX: "1"
        run: |
          node scripts/pack-test.mjs
          bash scripts/linux-smoke.sh release/linux*-unpacked/bulwark
          rm -rf release

      - name: Build the shell
        run: npm run build

      - name: Build installers
        env:
          ARCH: ${{ matrix.arch }}
        run: npx electron-builder --linux "--$ARCH" --publish never

      # after-pack checks the tree, and fpm and the others run after that.
      - name: Check the file modes in the packages
        run: node scripts/verify-package-modes.mjs release

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml
            !release/builder-debug.yml
            !release/builder-effective-config.yaml
          if-no-files-found: error
          retention-days: 7

  # A known hole in a crate the helper links in holds the release back. Whether it matters is
  # for a person to decide, in native/Cargo.lock or with an ignore in `audit.toml`.
  audit-native:
    name: Audit the native helper's crates
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        run: rustup toolchain install

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit
        working-directory: native
        run: cargo audit

  release:
    name: Publish the release
    needs: [prepare, windows, macos, linux, audit-native]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Once it starts, it finishes. A newer run's publish waits its turn.
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    # Betas wait for nobody, as asked. A stable release only waits if someone has created this
    # environment with reviewers: see the README.
    environment: ${{ contains(needs.prepare.outputs.version, '-') && 'beta' || 'release' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # The installers. latest.yml only says what an installer holds, so it gets no checksum of
      # its own, but it is attested: it says which file to trust.
      - name: Checksum installers
        working-directory: release
        run: |
          for file in *.exe *.msi *.dmg *.zip *.AppImage *.deb *.rpm; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml
            release/*.blockmap

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          WEBMAIL_REF: ${{ needs.prepare.outputs.webmail_ref }}
          WEBMAIL_COMMIT: ${{ needs.prepare.outputs.webmail_commit }}
          SHA: ${{ github.sha }}
          SIGNED_WIN: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          SIGNED_MAC: ${{ secrets.MAC_CERTIFICATE != '' }}
        run: |
          previous="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
          {
            case "$VERSION" in
              *-*)
                if [ "$SIGNED_WIN" = true ] && [ "$SIGNED_MAC" = true ]; then
                  echo 'This is a beta. The Windows installers are signed by Rath & Blume GbR, and the macOS app is signed with its Developer ID and notarized by Apple. The Linux packages are not signed. If you installed an unsigned macOS beta before, download this one once by hand: an unsigned build cannot update itself to a signed one.'
                else
                  echo 'This is a beta, and not every build is signed. An unsigned Windows installer gets "Windows protected your PC" from SmartScreen: choose More info, then Run anyway. An unsigned macOS app needs System Settings > Privacy & Security > Open Anyway the first time.'
                fi
                echo
                ;;
            esac
            echo "Built from the webmail's $WEBMAIL_REF at bulwarkmail/webmail@$WEBMAIL_COMMIT."
            echo
            if [ -n "$previous" ]; then
              echo "Since $previous:"
              echo
              gh api "repos/$GH_REPO/compare/$previous...$SHA" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' | tail -n 30
            else
              echo "The first release. Latest commits:"
              echo
              gh api "repos/$GH_REPO/commits?sha=$SHA&per_page=20" --jq '.[] | "- " + (.commit.message | split("\n")[0])'
            fi
          } > "$RUNNER_TEMP/notes.md"

          # The asset list is long. This gives one row per system with only the files people
          # install, linked from the files that were built, so a missing build drops its link.
          base="https://github.com/$GH_REPO/releases/download/v$VERSION"
          link() {
            for file in release/$2; do
              if [ -e "$file" ]; then printf '[%s](%s/%s)' "$1" "$base" "${file#release/}"; fi
              break
            done
          }
          # row <system> <link text> <AMD64 file> <ARM64 file>; a text with its own brackets
          # (the universal Mac image) gets no architecture added.
          row() {
            case "$2" in
              *"("*) amd="$(link "$2" "$3")"; arm="$(link "$2" "$4")" ;;
              *) amd="$(link "$2 (AMD64)" "$3")"; arm="$(link "$2 (ARM64)" "$4")" ;;
            esac
            if [ -n "$amd$arm" ]; then echo "| $1 | $amd | $arm |"; fi
          }
          {
            echo
            echo "## Download"
            echo
            echo "| System | AMD64 (Intel and AMD) | ARM64 |"
            echo "| --- | --- | --- |"
            row "Windows" "Installer" "*-x64.exe" "*-arm64.exe"
            row "macOS" "Disk image (universal)" "*.dmg" "*.dmg"
            row "Debian, Ubuntu" ".deb" "*_amd64.deb" "*_arm64.deb"
            row "Fedora, openSUSE" ".rpm" "*.x86_64.rpm" "*.aarch64.rpm"
            row "Other Linux" "AppImage" "*-x86_64.AppImage" "*-arm64.AppImage"
            row "Windows for IT" "MSI" "*-x64.msi" "*-arm64.msi"
            echo
            echo "Most Windows PCs need the AMD64 installer, and Macs with Apple silicon or Intel both use the same disk image. The other files under Assets are for the built-in updater and for checking a download."
          } >> "$RUNNER_TEMP/notes.md"

      # A tag this job creates with GITHUB_TOKEN starts no workflow, so a beta can't set off
      # another run. A prerelease is never Latest, which is what stable installs ask for.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          tag="v$VERSION"
          flags=()
          case "$VERSION" in
            *-*) flags+=(--prerelease --latest=false) ;;
          esac
          gh release create "$tag" --draft --target "$SHA" --title "Bulwark $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          gh release upload "$tag" release/* --clobber
          gh release edit "$tag" --draft=false "${flags[@]}"
