<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'self'" />
    <title>Bulwark</title>
    <style>
      /* Drawn like the webmail's Dialog and ConfirmDialog (components/ui): the page sends its colours, font and corners. */
      :root { --background: #fff; --foreground: #0f172a; --muted: #f1f5f9; --muted-foreground: #59687c; --border: #e2e8f0; --input: #e2e8f0; --primary: #185aea; --primary-foreground: #fff; --destructive: #dc2626; --destructive-foreground: #fff; --accent: #dbeafe; --accent-foreground: #1e40af; --ring: #2563eb; --radius: 8px; --radius-sm: 6px; --font: system-ui, sans-serif; }
      html, body { margin: 0; background: transparent; }
      body { padding: 24px; font-family: var(--font); color: var(--foreground); overflow: hidden; user-select: none; cursor: default; -webkit-font-smoothing: antialiased; font-feature-settings: "rlig" 1, "calt" 1; }
      .card { position: relative; box-sizing: border-box; width: 448px; display: flex; flex-direction: column; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 20px 25px -5px rgb(0 0 0 / .18), 0 8px 10px -6px rgb(0 0 0 / .14); }
      .dark .card { box-shadow: 0 20px 25px -5px rgb(0 0 0 / .5), 0 8px 10px -6px rgb(0 0 0 / .45); }
      /* The header is where the window is moved from; what can be clicked in it isn't. */
      .head { display: flex; align-items: flex-start; gap: 16px; padding: 24px 24px 0; -webkit-app-region: drag; flex-shrink: 0; }
      .head button, .menu { -webkit-app-region: no-drag; }
      .badge { flex: none; width: 40px; height: 40px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--destructive) 10%, transparent); color: var(--destructive); }
      .heading { flex: 1; min-width: 0; padding-inline-end: 8px; }
      h2 { margin: 0; font-size: 1.125rem; line-height: 1.75rem; font-weight: 600; color: var(--foreground); overflow-wrap: anywhere; max-height: 30vh; overflow-y: auto; }
      .source { margin: 2px 0 0; display: flex; align-items: center; gap: 4px; font-size: .75rem; line-height: 1rem; color: var(--muted-foreground); }
      .source span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .body { min-height: 0; overflow-y: auto; padding: 8px 24px 0; }
      .with-icon .body { padding-inline-start: 80px; }
      .with-source .body { padding-top: 12px; }
      .body:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
      .message { margin: 0; font-size: .875rem; line-height: 1.25rem; color: var(--muted-foreground); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; cursor: text; }
      .message strong { font-weight: 600; }
      .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 12px; padding: 24px; flex-shrink: 0; }
      button { font: inherit; cursor: default; }
      .button { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 500; border: 1px solid transparent; transition: background-color .2s, box-shadow .2s; outline: none; }
      .button:focus-visible, .icon:focus-visible, .item:focus-visible { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring); }
      .primary { background: var(--primary); color: var(--primary-foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
      .primary:hover { background: color-mix(in srgb, var(--primary) 90%, transparent); }
      .destructive { background: var(--destructive); color: var(--destructive-foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
      .destructive:hover { background: color-mix(in srgb, var(--destructive) 90%, transparent); }
      .secondary { border-color: var(--input); background: var(--background); color: var(--foreground); }
      .secondary:hover { background: var(--accent); color: var(--accent-foreground); }
      .icon { flex: none; padding: 6px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--muted-foreground); display: flex; outline: none; }
      .icon:hover, .icon[aria-expanded="true"] { background: var(--muted); color: var(--foreground); }
      .menu-wrap { position: relative; flex: none; margin: -4px -8px 0 0; }
      [dir="rtl"] .menu-wrap { margin: -4px 0 0 -8px; }
      .menu { position: absolute; inset-inline-end: 0; top: 100%; margin-top: 4px; z-index: 1; min-width: 200px; padding: 4px 0; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--background); box-shadow: 0 10px 15px -3px rgb(0 0 0 / .12), 0 4px 6px -4px rgb(0 0 0 / .1); }
      .menu[hidden] { display: none; }
      .item { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 0; background: transparent; color: var(--foreground); font-size: .875rem; text-align: start; outline: none; }
      .item:hover, .item:focus { background: var(--muted); }
      .item.danger { color: var(--destructive); }
      .item.danger:hover, .item.danger:focus { background: color-mix(in srgb, var(--destructive) 10%, transparent); }
      svg { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      @media (prefers-reduced-motion: no-preference) { .card { animation: in .15s ease-out; } }
      @keyframes in { from { opacity: 0; transform: scale(.97); } }
      @media (forced-colors: active) { .card { border-color: CanvasText; } }
    </style>
  </head>
  <body>
    <div class="card" id="card" role="alertdialog" aria-modal="true" aria-labelledby="title">
      <div class="head" id="head">
        <div class="heading">
          <h2 id="title"></h2>
        </div>
      </div>
      <div class="body" id="body"><p class="message" id="message"></p></div>
      <div class="foot" id="foot"></div>
    </div>
    <script src="dialog.js"></script>
  </body>
</html>
