<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self'" />
    <title>Bulwark</title>
    <style>
      /* Drawn like the webmail's dialogs and form fields (components/ui): the page sends its colours, font and corners. */
      :root { --background: #fff; --foreground: #0f172a; --muted: #f1f5f9; --muted-foreground: #59687c; --border: #e2e8f0; --input: #e2e8f0; --primary: #185aea; --primary-foreground: #fff; --destructive: #dc2626; --destructive-foreground: #fff; --accent: #dbeafe; --accent-foreground: #1e40af; --ring: #2563eb; --radius: 8px; --radius-sm: 6px; --font: system-ui, sans-serif; }
      html, body { margin: 0; height: 100%; background: transparent; }
      body { box-sizing: border-box; padding: 32px; font-family: var(--font); color: var(--foreground); overflow: hidden; user-select: none; cursor: default; -webkit-font-smoothing: antialiased; }
      .card { box-sizing: border-box; width: 100%; height: 100%; display: grid; grid-template-columns: 320px minmax(0, 1fr); background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: 0 20px 25px -5px rgb(0 0 0 / .18), 0 8px 10px -6px rgb(0 0 0 / .14); }
      .dark .card { box-shadow: 0 20px 25px -5px rgb(0 0 0 / .5), 0 8px 10px -6px rgb(0 0 0 / .45); }
      .side { display: flex; flex-direction: column; min-height: 0; border-inline-end: 1px solid var(--border); }
      /* The header is where the window is moved from. */
      .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 20px 24px 12px; -webkit-app-region: drag; flex-shrink: 0; }
      h2 { margin: 0; font-size: 1.125rem; line-height: 1.75rem; font-weight: 600; }
      .count { font-size: .875rem; color: var(--muted-foreground); white-space: nowrap; }
      .fields { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 24px 16px; display: flex; flex-direction: column; gap: 14px; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field[hidden], .more[hidden], .row[hidden] { display: none; }
      .label { font-size: .875rem; font-weight: 500; line-height: 1.25rem; }
      select, input[type="text"], input[type="number"] { box-sizing: border-box; width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--input); border-radius: var(--radius-sm); background: var(--background); color: var(--foreground); font: inherit; font-size: .875rem; outline: none; }
      select { cursor: default; }
      input[type="text"], input[type="number"] { user-select: text; cursor: text; }
      select:focus-visible, input:focus-visible, button:focus-visible { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring); }
      input[aria-invalid="true"] { border-color: var(--destructive); }
      .error { margin: 0; font-size: .75rem; line-height: 1rem; color: var(--destructive); }
      .error:empty { display: none; }
      .check { display: flex; align-items: center; gap: 8px; font-size: .875rem; }
      .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); }
      .toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 0; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--foreground); font: inherit; font-size: .875rem; font-weight: 500; text-align: start; outline: none; border-radius: 0; }
      .toggle svg { transition: transform .15s; }
      .toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
      .more { display: flex; flex-direction: column; gap: 14px; }
      .linkish { align-self: flex-start; padding: 2px 0; border: 0; background: transparent; color: var(--primary); font: inherit; font-size: .875rem; text-decoration: underline; text-underline-offset: 2px; outline: none; border-radius: 2px; }
      .dark .linkish { color: var(--foreground); }
      .linkish:hover { text-decoration-thickness: 2px; }
      .foot { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
      button { font: inherit; cursor: default; }
      .button { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 500; border: 1px solid transparent; transition: background-color .2s, box-shadow .2s; outline: none; }
      .button:disabled { opacity: .5; }
      .primary { background: var(--primary); color: var(--primary-foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
      .primary:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 90%, transparent); }
      .secondary { border-color: var(--input); background: var(--background); color: var(--foreground); }
      .secondary:hover { background: var(--accent); color: var(--accent-foreground); }
      .preview { position: relative; min-width: 0; min-height: 0; background: var(--muted); }
      .preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; background: transparent; }
      .preview iframe.front { visibility: visible; }
      /* Black and white: the printer's job, shown here as it will look. */
      .preview.mono iframe { filter: grayscale(1); }
      .status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: .875rem; color: var(--muted-foreground); pointer-events: none; }
      .status:empty { display: none; }
      .status.over { inset: auto 16px 16px auto; padding: 6px 10px; border-radius: var(--radius-sm); background: var(--background); border: 1px solid var(--border); }
      svg { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      @media (prefers-reduced-motion: no-preference) { .card { animation: in .15s ease-out; } }
      @keyframes in { from { opacity: 0; transform: scale(.98); } }
      @media (forced-colors: active) { .card { border-color: CanvasText; } }
    </style>
  </head>
  <body>
    <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="title">
      <aside class="side">
        <div class="head">
          <h2 id="title"></h2>
          <span class="count" id="count" aria-live="polite"></span>
        </div>
        <div class="fields">
          <div class="field">
            <label class="label" for="destination" id="destination-label"></label>
            <select id="destination"></select>
          </div>
          <div class="field">
            <label class="label" for="pages-mode" id="pages-label"></label>
            <select id="pages-mode">
              <option value="all" id="pages-all"></option>
              <option value="custom" id="pages-custom"></option>
            </select>
            <input type="text" id="pages" inputmode="numeric" autocomplete="off" spellcheck="false" hidden aria-describedby="pages-error" />
            <p class="error" id="pages-error" role="alert"></p>
          </div>
          <div class="field" id="copies-field">
            <label class="label" for="copies" id="copies-label"></label>
            <input type="number" id="copies" min="1" max="99" step="1" value="1" />
          </div>
          <div class="field">
            <label class="label" for="layout" id="layout-label"></label>
            <select id="layout">
              <option value="portrait" id="layout-portrait"></option>
              <option value="landscape" id="layout-landscape"></option>
            </select>
          </div>
          <div class="field" id="color-field">
            <label class="label" for="color" id="color-label"></label>
            <select id="color">
              <option value="color" id="color-color"></option>
              <option value="mono" id="color-mono"></option>
            </select>
          </div>
          <button type="button" class="toggle" id="more-toggle" aria-expanded="false" aria-controls="more">
            <span id="more-label"></span>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6l6 -6" /></svg>
          </button>
          <div class="more" id="more" hidden>
            <div class="field">
              <label class="label" for="paper" id="paper-label"></label>
              <select id="paper"></select>
            </div>
            <div class="field" id="margins-field">
              <label class="label" for="margins" id="margins-label"></label>
              <select id="margins">
                <option value="default" id="margins-default"></option>
                <option value="none" id="margins-none"></option>
                <option value="minimum" id="margins-minimum"></option>
              </select>
            </div>
            <div class="field">
              <label class="label" for="scale" id="scale-label"></label>
              <input type="number" id="scale" min="10" max="200" step="1" value="100" />
            </div>
            <div class="field" id="options-field" role="group" aria-labelledby="options-label">
              <span class="label" id="options-label"></span>
              <label class="check"><input type="checkbox" id="header-footer" /><span id="header-footer-label"></span></label>
              <label class="check"><input type="checkbox" id="background" /><span id="background-label"></span></label>
            </div>
          </div>
          <button type="button" class="linkish" id="system"></button>
        </div>
        <div class="foot">
          <button type="button" class="button secondary" id="cancel"></button>
          <button type="button" class="button primary" id="go" disabled></button>
        </div>
      </aside>
      <section class="preview" id="preview">
        <iframe id="frame-a" class="front" tabindex="-1"></iframe>
        <iframe id="frame-b" tabindex="-1"></iframe>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </section>
    </div>
    <script src="print.js"></script>
  </body>
</html>
