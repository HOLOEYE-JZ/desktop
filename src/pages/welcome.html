<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Bulwark</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 28px 36px; user-select: none; cursor: default; background: Canvas; color: CanvasText; min-height: 100vh; box-sizing: border-box; }
      h1 { font-size: 1.4em; font-weight: 600; margin: 0 0 4px; }
      p { margin: 0 0 20px; opacity: .75; }
      button { display: block; width: 100%; text-align: start; font: inherit; padding: 14px 16px; margin-bottom: 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); background: transparent; color: inherit; cursor: default; }
      button:hover { background: color-mix(in srgb, currentColor 7%, transparent); }
      [hidden] { display: none !important; }
      #form, #email-form { margin-top: 4px; }
      label { display: block; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; color: inherit; user-select: text; }
      .connect { display: inline-block; width: auto; margin-top: 10px; padding: 8px 18px; }
      .error { color: #d43; margin-top: 6px; }
      .error:empty, .status:empty { display: none; }
      .status { margin-top: 6px; opacity: .75; }
      .connect:disabled { opacity: .6; }
      .link { display: inline; width: auto; margin: 22px 0 0; padding: 0; border: 0; border-radius: 0; text-decoration: underline; text-underline-offset: 3px; opacity: .85; }
      .link:hover { background: transparent; opacity: 1; }
      html[dir="rtl"] #url, html[dir="rtl"] #email { text-align: right; }
      .actions { display: flex; gap: 10px; }
      .actions .connect { margin-bottom: 0; }
      #privacy { display: none; margin: 0; }
      #privacy.open { display: block; }
      .choice { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
      .choice input { width: auto; margin: 4px 0 0; flex: none; }
      .choice label { font-weight: 600; margin: 0; }
      .choice small { display: block; font-size: .87em; line-height: 1.4; opacity: .75; }
    </style>
  </head>
  <body>
    <div id="connection">
      <h1 id="title"></h1>
      <p id="intro"></p>
      <form id="email-form">
        <label for="email" id="email-label"></label>
        <input id="email" type="text" inputmode="email" placeholder="name@example.com" autocomplete="email" spellcheck="false" autocapitalize="off" dir="ltr" aria-describedby="email-error" />
        <div id="email-error" class="error" role="alert"></div>
        <button id="standalone" class="connect" type="submit"></button>
      </form>
      <button id="instance" class="link" type="button"></button>
    </div>
    <div id="org" hidden>
      <h1 id="instance-title"></h1>
      <p id="instance-text"></p>
      <form id="form">
        <label for="url" id="url-label"></label>
        <input id="url" type="text" inputmode="url" placeholder="mail.example.com" autocomplete="url" spellcheck="false" autocapitalize="off" dir="ltr" aria-describedby="error" />
        <div id="error" class="error" role="alert"></div>
        <div id="status" class="status" role="status"></div>
        <div class="actions"><button id="org-back" class="connect" type="button"></button><button id="connect" class="connect" type="submit"></button></div>
      </form>
    </div>
    <form id="privacy">
      <h1 id="privacy-title"></h1>
      <p id="privacy-intro"></p>
      <div class="choice" id="telemetry-row"><input id="telemetry" type="checkbox" aria-describedby="telemetry-text" /><div><label for="telemetry" id="telemetry-label"></label><small id="telemetry-text"></small></div></div>
      <div class="choice" id="crash-row"><input id="crash" type="checkbox" aria-describedby="crash-text" /><div><label for="crash" id="crash-label"></label><small id="crash-text"></small></div></div>
      <div class="actions"><button id="back" class="connect" type="button"></button><button id="continue" class="connect" type="submit"></button></div>
    </form>
    <script src="welcome.js"></script>
  </body>
</html>
