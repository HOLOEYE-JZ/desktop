<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Bulwark</title>
    <style>
      /* The webmail's sign-in card in its standard theme (app/(main)/[locale]/login/page.tsx), light and dark. */
      :root { color-scheme: light; --background: #ffffff; --foreground: #0f172a; --muted: #f1f5f9; --muted-foreground: #59687c; --border: #e2e8f0; --input: #e2e8f0; --ring: #2563eb; --primary: #185aea; --primary-foreground: #ffffff; --destructive: #dc2626; --logo: rgb(219, 45, 84); --shadow: rgb(0 0 0 / .05); --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif; }
      :root.dark { color-scheme: dark; --background: #0a0a0a; --foreground: #fafafa; --muted: #262626; --muted-foreground: #adadad; --border: rgba(128, 128, 128, .3); --input: #262626; --ring: #d4d4d4; --primary: #fafafa; --primary-foreground: #171717; --destructive: #ef4444; --logo: #ffffff; --shadow: rgb(0 0 0 / .2); }
      html, body { margin: 0; }
      body { box-sizing: border-box; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; font: 15px/1.5 var(--font); color: var(--foreground); background: linear-gradient(to bottom right, var(--background), color-mix(in srgb, var(--muted) 10%, var(--background)), color-mix(in srgb, var(--muted) 30%, var(--background))); user-select: none; cursor: default; -webkit-font-smoothing: antialiased; }
      .card { box-sizing: border-box; width: 100%; max-width: 440px; padding: 32px 32px 32px; border: 1px solid color-mix(in srgb, var(--border) 60%, transparent); border-radius: 16px; background: color-mix(in srgb, var(--background) 80%, transparent); box-shadow: 0 20px 25px -5px var(--shadow), 0 8px 10px -6px var(--shadow); }
      .logo { display: block; width: 64px; height: 64px; margin: 8px auto 20px; fill: var(--logo); }
      h1 { margin: 0; text-align: center; font-size: 1.5rem; line-height: 2rem; font-weight: 600; letter-spacing: -.025em; }
      .lead { margin: 6px 0 24px; text-align: center; font-size: .875rem; line-height: 1.25rem; color: var(--muted-foreground); }
      [hidden] { display: none !important; }
      label { display: block; margin-bottom: 6px; font-size: .875rem; font-weight: 500; }
      input[type="text"] { display: block; width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px; font: inherit; font-size: .9375rem; color: var(--foreground); background: color-mix(in srgb, var(--muted) 40%, transparent); border: 1px solid color-mix(in srgb, var(--border) 60%, transparent); border-radius: 12px; outline: none; user-select: text; transition: background-color .2s, border-color .2s, box-shadow .2s; }
      input[type="text"]::placeholder { color: var(--muted-foreground); }
      input[type="text"]:focus { background: var(--background); border-color: color-mix(in srgb, var(--primary) 50%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 20%, transparent); }
      input[aria-invalid="true"] { border-color: var(--destructive); box-shadow: 0 0 0 3px color-mix(in srgb, var(--destructive) 20%, transparent); }
      input[readonly] { color: var(--muted-foreground); }
      html[dir="rtl"] #url, html[dir="rtl"] #email { text-align: right; }
      button { font: inherit; cursor: default; }
      .button { display: flex; align-items: center; justify-content: center; width: 100%; height: 44px; padding: 0 16px; border-radius: 12px; font-size: .9375rem; font-weight: 500; border: 1px solid transparent; outline: none; transition: background-color .2s, box-shadow .2s; }
      .button:focus-visible, .text-link:focus-visible, .inline-link:focus-visible { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring); }
      .primary { margin-top: 20px; background: var(--primary); color: var(--primary-foreground); box-shadow: 0 4px 6px -1px color-mix(in srgb, var(--primary) 15%, transparent); }
      .primary:hover { background: color-mix(in srgb, var(--primary) 90%, transparent); }
      .primary:disabled { opacity: .6; }
      .secondary { margin-top: 20px; background: transparent; color: var(--foreground); border-color: color-mix(in srgb, var(--border) 60%, transparent); }
      .secondary:hover { background: color-mix(in srgb, var(--muted) 50%, transparent); }
      .actions { display: flex; gap: 12px; }
      .actions .button { flex: 1; }
      .text-link { display: block; margin: 16px auto 0; padding: 4px 6px; border: 0; border-radius: 6px; background: transparent; color: var(--muted-foreground); font-size: .875rem; text-align: center; outline: none; }
      .text-link:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }
      .error { margin-top: 6px; font-size: .8125rem; line-height: 1.35; color: var(--destructive); }
      .inline-link { display: inline; margin-inline-start: 4px; padding: 0; border: 0; border-radius: 2px; background: transparent; color: inherit; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; outline: none; }
      .status { margin-top: 6px; font-size: .8125rem; color: var(--muted-foreground); }
      .status:empty { display: none; }
      #privacy { display: none; margin: 0; }
      #privacy.open { display: block; }
      .choice { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
      .choice input { flex: none; width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--primary); }
      .choice label { margin: 0; font-weight: 600; }
      .choice small { display: block; font-size: .8125rem; line-height: 1.4; color: var(--muted-foreground); }
      @media (forced-colors: active) { .card { border-color: CanvasText; } .logo { fill: CanvasText; } }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <svg class="logo" viewBox="0 0 1000 1000" role="img" aria-label="Bulwark"><path d="M 373.467 557.247 L 55.226 271.52 L 55.226 385.564 C 55.226 398.153 62.453 415.6 71.355 424.501 L 107.525 460.671 C 116.426 469.573 123.653 487.02 123.653 499.609 L 123.653 682.08 C 123.655 718.462 133.336 750.017 152.047 778.668 L 373.467 557.247 Z M 626.533 557.247 L 944.774 271.52 L 944.774 396.969 C 944.774 403.263 941.16 411.987 936.709 416.437 L 884.411 468.736 C 879.96 473.186 876.347 481.91 876.347 488.204 L 876.347 682.08 C 876.345 718.462 866.664 750.017 847.953 778.668 L 626.533 557.247 Z M 500 638.743 L 500 638.743 C 466.206 638.738 448.855 625.316 424.448 603.033 L 197.809 829.672 C 261.382 884.635 364.213 931.859 500 990 Q 500 990 500 990 C 635.787 931.859 738.618 884.635 802.191 829.672 L 575.552 603.033 C 551.145 625.316 533.794 638.738 500 638.743 Z M 483.028 563.647 L 63.713 187.183 C 59.029 182.978 55.226 174.454 55.226 168.159 L 55.226 122.542 C 55.226 116.247 60.206 109.988 66.339 108.573 L 215.181 74.225 C 221.314 72.809 226.293 76.77 226.293 83.065 L 226.293 176.92 L 352.034 147.895 C 358.167 146.479 363.147 140.219 363.147 133.925 L 363.147 51.483 C 363.147 45.189 368.126 38.93 374.259 37.514 L 488.888 11.061 C 495.021 9.646 504.979 9.646 511.112 11.061 L 625.741 37.514 C 631.874 38.93 636.853 45.189 636.853 51.483 L 636.853 133.925 C 636.853 140.219 641.833 146.479 647.966 147.895 L 773.707 176.92 L 773.707 83.065 C 773.707 76.77 778.686 72.809 784.819 74.225 L 933.661 108.573 C 939.794 109.988 944.774 116.247 944.774 122.542 L 944.774 168.159 C 944.774 174.454 940.971 182.978 936.287 187.183 L 516.972 563.647 C 507.605 572.056 492.395 572.056 483.028 563.647 Z" /></svg>
      <div id="connection">
        <h1 id="title"></h1>
        <p id="intro" class="lead"></p>
        <form id="email-form">
          <label for="email" id="email-label"></label>
          <input id="email" type="text" inputmode="email" placeholder="name@example.com" autocomplete="email" spellcheck="false" autocapitalize="off" dir="ltr" aria-describedby="email-error" />
          <div id="email-error" class="error" role="alert" hidden><span id="email-error-text"></span><button id="email-error-link" class="inline-link" type="button" hidden></button></div>
          <button id="standalone" class="button primary" type="submit"></button>
        </form>
        <button id="instance" class="text-link" type="button"></button>
      </div>
      <div id="org" hidden>
        <h1 id="instance-title"></h1>
        <p id="instance-text" class="lead"></p>
        <form id="form">
          <label for="url" id="url-label"></label>
          <input id="url" type="text" inputmode="url" placeholder="mail.example.com" autocomplete="url" spellcheck="false" autocapitalize="off" dir="ltr" aria-describedby="error" />
          <div id="error" class="error" role="alert" hidden><span id="error-text"></span><button id="error-link" class="inline-link" type="button" hidden></button></div>
          <div id="status" class="status" role="status"></div>
          <div class="actions"><button id="org-back" class="button secondary" type="button"></button><button id="connect" class="button primary" type="submit"></button></div>
        </form>
      </div>
      <form id="privacy">
        <h1 id="privacy-title"></h1>
        <p id="privacy-intro" class="lead"></p>
        <div class="choice" id="telemetry-row"><input id="telemetry" type="checkbox" aria-describedby="telemetry-text" /><div><label for="telemetry" id="telemetry-label"></label><small id="telemetry-text"></small></div></div>
        <div class="choice" id="crash-row"><input id="crash" type="checkbox" aria-describedby="crash-text" /><div><label for="crash" id="crash-label"></label><small id="crash-text"></small></div></div>
        <div class="actions"><button id="back" class="button secondary" type="button"></button><button id="continue" class="button primary" type="submit"></button></div>
      </form>
    </main>
    <script src="welcome.js"></script>
  </body>
</html>
