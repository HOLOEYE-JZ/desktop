# Package layout and hardening. Installers, channels, MSI and release workflows are
# step 6; this keeps `npm run pack:dir` and the fuses in place from the start.
appId: org.bulwarkmail.desktop
productName: Bulwark
copyright: Copyright (C) 2025-2026 Bulwark Project Authors
directories:
  output: release
  buildResources: build
asar: true
# A native module can't load from inside an asar. Electron's loader follows the link.
asarUnpack:
  - '**/*.node'
files:
  - dist/**/*
  - package.json
  # The native helper, per architecture. Missing means the app runs without it.
  - from: native/dist/${platform}-${arch}
    to: native
    filter:
      - bulwark-native.node
# The webmail server stays unpacked: it needs a real cwd, and Next reads its own files.
extraResources:
  # ADMX, ADML and samples from the webmail, for IT. See scripts/fetch-webmail.mjs.
  - from: policies
    to: policies
  - from: webmail
    to: server
    filter:
      - '**/*'
      - '**/.next/**'
      - '!node_modules/**'
# node_modules: see scripts/after-pack.cjs.
afterPack: scripts/after-pack.cjs
# INSTANCE_URL, FORCE_INSTANCE and UPDATE_CHANNEL. The NSIS side is build/installer.nsh.
msiProjectCreated: scripts/msi-policies.cjs
# policy-watcher is N-API, so what `npm ci` built loads in Electron as it is.
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  # Signing hook: unsigned for now. A signing certificate or Azure signing goes here.
  # signtoolOptions: {}
  # azureSignOptions: {}
  target: dir
mac:
  # Hardened runtime and notarization are driven by env in CI, unused here.
  hardenedRuntime: true
  target: dir
linux:
  target: dir
  category: Network;Email
