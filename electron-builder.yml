# Package layout and hardening. Installers, channels, MSI and release workflows are
# step 6; this keeps `npm run pack:dir` and the fuses in place from the start.
appId: org.bulwarkmail.desktop
productName: Bulwark
copyright: Copyright (C) 2025-2026 Bulwark Project Authors
directories:
  output: release
  buildResources: build
asar: true
# A native module can't load from inside an asar. Electron's loader follows the link.
asarUnpack:
  - '**/*.node'
files:
  - dist/**/*
  - package.json
  # The native helper, per architecture. Missing means the app runs without it.
  - from: native/dist/${platform}-${arch}
    to: native
    filter:
      - bulwark-native.node
# The webmail server stays unpacked: it needs a real cwd, and Next reads its own files.
extraResources:
  - from: webmail
    to: server
    filter:
      - '**/*'
      - '**/.next/**'
      - '!node_modules/**'
# node_modules: see scripts/after-pack.cjs.
afterPack: scripts/after-pack.cjs
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  # Signing hook: unsigned for now. A signing certificate or Azure signing goes here.
  # signtoolOptions: {}
  # azureSignOptions: {}
  target: dir
# Windows registers its URL schemes and file types at run time (os-default-app.ts) and
# not through these: electron-builder's NSIS writes them as HKCU's default for the type,
# which takes mailto: and .eml from whoever had them. Which app is the default stays the
# user's choice there.
nsis:
  include: build/installer.nsh
mac:
  # Hardened runtime and notarization are driven by env in CI, unused here.
  hardenedRuntime: true
  target: dir
  protocols:
    - name: Mail
      schemes: [mailto]
      role: Editor
    - name: Calendar
      schemes: [webcal, webcals]
      role: Viewer
    - name: Bulwark
      schemes: [bulwark]
      role: Viewer
  fileAssociations:
    - ext: eml
      name: E-mail message
      role: Viewer
    - ext: ics
      name: Calendar file
      role: Viewer
    - ext: vcf
      name: Contact card
      role: Viewer
linux:
  target: dir
  category: Network;Email
  # Binary and .desktop file named alike: Unity's count and the window's app_id look at
  # desktopName in package.json, and without these the file is bulwark-desktop.desktop.
  executableName: bulwark
  syncDesktopName: true
  # electron-builder adds %U to Exec and fills MimeType from these.
  mimeTypes:
    - x-scheme-handler/mailto
    - x-scheme-handler/webcal
    - x-scheme-handler/webcals
    - x-scheme-handler/bulwark
    - message/rfc822
    - text/calendar
    - text/vcard
    - text/x-vcard
  fileAssociations:
    - ext: eml
      mimeType: message/rfc822
    - ext: ics
      mimeType: text/calendar
    - ext: vcf
      mimeType: text/vcard
  desktop:
    entry:
      Actions: NewMessage;Inbox;Calendar;Contacts;
    desktopActions:
      NewMessage:
        Name: New message
        Name[de]: Neue Nachricht
        Exec: bulwark bulwark://new
      Inbox:
        Name: Inbox
        Name[de]: Posteingang
        Exec: bulwark bulwark://inbox
      Calendar:
        Name: Calendar
        Name[de]: Kalender
        Exec: bulwark bulwark://calendar
      Contacts:
        Name: Contacts
        Name[de]: Kontakte
        Exec: bulwark bulwark://contacts
